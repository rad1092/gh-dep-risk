name: install-smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install released extension
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_CONFIG_DIR: ${{ runner.temp }}/gh-config
        run: |
          set -euo pipefail
          mkdir -p "$GH_CONFIG_DIR"
          gh extension install rad1092/gh-dep-risk --force
          gh dep-risk version
          gh dep-risk version --json
          for pr in 3 1 2 4 5 6 7 8 9 10; do
            gh dep-risk pr "$pr" --repo rad1092/gh-dep-risk-smoke-matrix --lang en --format json --no-registry > "dep-risk-${pr}.json"
            grep -E '"score"|"level"|"dependency_review_available"' "dep-risk-${pr}.json"
          done

          set +e
          gh dep-risk pr 11 --repo rad1092/gh-dep-risk-smoke-matrix --lang en --format json --no-registry > dep-risk-11.json
          exit_code=$?
          set -e
          if [[ "$exit_code" != "2" ]]; then
            echo "expected unsupported bun.lockb fixture to exit 2, got ${exit_code}" >&2
            exit 1
          fi
